name: MCP Server Release

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MCP server
        run: pnpm --filter @operaciones-planner/mcp-server exec tsc --noEmit

      - name: Build MCP server
        run: pnpm --filter @operaciones-planner/mcp-server build

      - name: Prepare release asset
        run: cp packages/mcp-server/dist/index.js operaciones-planner-mcp.js

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: operaciones-planner-mcp.js
          name: MCP Server ${{ github.ref_name }}
          body: |
            Servidor MCP local de Operaciones Planner para Claude Desktop.

            El instalador normal descarga el bundle desde el backend de la empresa,
            no desde este release: `{servidor}/api/mcp/install.ps1`.

            Windows (PowerShell):
            ```
            Invoke-WebRequest http://192.168.25.7:3001/api/mcp/install.ps1 -OutFile install.ps1
            powershell -ExecutionPolicy Bypass -File install.ps1
            ```
            macOS / Linux:
            ```
            curl -fsSL http://192.168.25.7:3001/api/mcp/install.sh -o install.sh && bash install.sh
            ```
