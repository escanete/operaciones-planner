# Servidor nginx para el frontend de Operaciones Planner
# Sirve la SPA y proxyea /api al backend (mismo origen: sin CORS ni problemas de cookies)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Debe ser mayor que MS_GRAPH_MAX_UPLOAD_MB del backend (100 MB)
    client_max_body_size 110m;

    # API -> backend (nombre del servicio en docker-compose)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA (react-router): fallback a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
